# dosbox-x.conf - Space Quest III (SCI0, 1989) driving the mt32-t113 port.
#
# Only the parts that matter are set. The MIDI section is the point: the
# MPU-401 that SQ3's MT32.DRV talks to is emulated by DOSBox-X, and every byte
# the driver writes to port 330h goes out through CoreMIDI to the virtual
# destination "mt32-t113" that `mt32-desktop --midi-seq` publishes. From there
# it is the same parser, the same sysex reassembly and the same engine binding
# that the T113 will run. The game directory is mounted by run.sh with -c.
#
# SPDX-License-Identifier: 0BSD

[sdl]
autolock=true
output=opengl

[dosbox]
title=Space Quest III -> mt32-t113
# Closing the window is how a run ends; no "are you sure" in the way.
quit warning=false
machine=ega
memsize=4

[cpu]
# SCI0 runs its interpreter flat out; on a fast CPU the game speed slider is
# useless and the animation is a blur. ~4000 cycles is a 286 and feels right.
cycles=fixed 4000

[midi]
mpu401=intelligent
mididevice=coremidi
# Matched by name against CoreMIDI destinations. If a second copy of
# mt32-desktop is running there are two of these; DOSBox-X takes the first.
midiconfig=mt32-t113

[sblaster]
# SQ3 predates the Sound Blaster and its MT32.DRV never touches one; leaving
# it out makes it impossible to hear anything that did not come through MIDI.
sbtype=none

[speaker]
pcspeaker=false
